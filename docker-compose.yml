services:
  db:
    image: postgres:16-alpine
    container_name: alphasquad-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - alphasquad-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphasquad-net

  redis:
    image: redis:7-alpine
    container_name: alphasquad-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - alphasquad-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphasquad-net

  api:
    build:
      context: .
      dockerfile: src/AlphaSquad.Api/Dockerfile
    container_name: alphasquad-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      App__EnableHttpsRedirection: "false"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      PlatformBootstrap__Name: ${PLATFORM_OWNER_NAME}
      PlatformBootstrap__Email: ${PLATFORM_OWNER_EMAIL}
      PlatformBootstrap__Password: ${PLATFORM_OWNER_PASSWORD}
      Storage__Provider: ${STORAGE_PROVIDER}
      Storage__Endpoint: ${STORAGE_ENDPOINT}
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      Storage__BucketName: ${STORAGE_BUCKET_NAME}
      Storage__PublicBaseUrl: ${STORAGE_PUBLIC_BASE_URL}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alphasquad-net

volumes:
  alphasquad-postgres-data:
  alphasquad-redis-data:

networks:
  alphasquad-net:
